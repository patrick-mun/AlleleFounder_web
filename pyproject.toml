[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "allelefounder-web"
version = "0.1.0"
description = "Interface web institutionnelle d'AlleleFounder"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Django==5.2.19",
  "gunicorn==27.0.1",
  "psycopg[binary]==3.3.9",
]

[project.optional-dependencies]
dev = [
  "pip-tools==7.7.0",
  "ruff==0.17.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/allelefounder/accounts/migrations/*.py" = ["E501"]
